{{- if .Values.tls.privateCA.enabled }}
{{- $name := include "lv.name" . }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned
  labels: {{- include "lv.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-ca
  labels: {{- include "lv.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ .Values.tls.privateCA.commonName | quote }}
  secretName: {{ $name }}-ca
  duration: 87600h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Never }
  issuerRef: { name: {{ $name }}-selfsigned, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-ca
  labels: {{- include "lv.labels" . | nindent 4 }}
spec:
  ca: { secretName: {{ $name }}-ca }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-gateway
  labels: {{- include "lv.labels" . | nindent 4 }}
spec:
  secretName: {{ $name }}-gateway-tls
  duration: {{ .Values.tls.certificate.duration }}
  renewBefore: {{ .Values.tls.certificate.renewBefore }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  commonName: {{ $name }}-gateway
  dnsNames:
    - {{ $name }}-gateway
    - {{ $name }}-gateway.{{ .Release.Namespace }}.svc
    {{- range .Values.tls.certificate.dnsNames }}
    - {{ . }}
    {{- end }}
  {{- with .Values.tls.certificate.ipAddresses }}
  ipAddresses: {{ toYaml . | nindent 4 }}
  {{- end }}
  usages: [server auth, digital signature, key encipherment]
  issuerRef: { name: {{ $name }}-ca, kind: Issuer }
{{- end }}
