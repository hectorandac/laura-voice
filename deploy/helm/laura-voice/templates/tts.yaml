{{- if .Values.tts.enabled }}
{{- $c := dict "root" . "component" "tts" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lv.name" . }}-tts
  labels: {{- include "lv.labels" . | nindent 4 }}
    app.kubernetes.io/component: tts
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "lv.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lv.selector" $c | nindent 8 }}
    spec:
      {{- include "lv.placement" . | nindent 6 }}
      securityContext: { runAsUser: 10001, runAsGroup: 10001 }
      initContainers:
        - name: cache-owner
          image: {{ include "lv.image" (dict "root" . "image" .Values.deviceEndpoint.image) }}
          command: ["sh", "-c", "chown 10001:10001 /cache"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: cache, mountPath: /cache }
      containers:
        - name: tts
          image: {{ include "lv.image" (dict "root" . "image" .Values.tts.image) }}
          imagePullPolicy: {{ .Values.tts.image.pullPolicy }}
          {{- with .Values.tts.env }}
          env:
            {{- range $k, $v := . }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.tts.port }} }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources: {{- include "lv.resources" (dict "root" . "res" .Values.tts.resources "gpu" (ne .Values.tts.gpu false)) | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: {{ .Values.tts.cacheMountPath }} }
      volumes:
        - name: cache
          hostPath: { path: {{ .Values.tts.cacheHostPath }}, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lv.name" . }}-tts
  labels: {{- include "lv.labels" . | nindent 4 }}
spec:
  selector: {{- include "lv.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.tts.port }}, targetPort: http }
{{- end }}
