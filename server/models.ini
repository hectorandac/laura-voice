version = 1

; Shared by every model: full GPU offload, flash attention, 8-bit KV cache, one slot (single user)
[*]
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true

; Daily driver: fast, long context
[bonsai-9b]
model = /models/Ternary-Bonsai-2-9B-PTQ1_0.gguf
c = 131072

; Higher quality, 32K context
[bonsai-27b]
model = /models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
c = 32768

; Higher quality, 64K context with a 4-bit KV cache
[bonsai-27b-64k]
model = /models/Ternary-Bonsai-2-27B-PTQ1_0.gguf
c = 65536
cache-type-k = q4_0
cache-type-v = q4_0

; Voice assistant: short conversations, leaves room for ASR + TTS on the GPU
[bonsai-9b-voice]
model = /models/Ternary-Bonsai-2-9B-PTQ1_0.gguf
c = 16384
