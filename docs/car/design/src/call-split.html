<!doctype html><html><head><meta charset="utf-8"><title>Call card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.content > .map { flex: 1.7; }
.call { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 14px); padding: calc(var(--u) * 28px); }
.call .portrait { width: calc(var(--u) * 168px); height: calc(var(--u) * 168px); }
.call h1 { font-size: calc(var(--u) * 40px); font-weight: 600; letter-spacing: -.8px; color: var(--aa-ink); line-height: 1; }
.call .meta { font-size: calc(var(--u) * 22px); color: var(--aa-muted); }
.btns { display: flex; gap: calc(var(--u) * 18px); margin-top: calc(var(--u) * 10px); }
.btn { width: calc(var(--u) * 84px); height: calc(var(--u) * 64px); border-radius: 999px; background: var(--aa-surface-2); display: grid; place-items: center; }
.btn.end { width: calc(var(--u) * 112px); background: var(--end); }
.btn svg { width: 45%; height: 45%; }
</style></head>
<body><div class="aa">
  <div class="rail"><div class="clock">9:41</div>
    <div class="apps"><div class="app maps"></div><div class="app laura active"></div><div class="app"></div></div>
    <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="content">
    <div class="card map"><div class="turn"><span class="arrow">&#x2197;</span><div>300 m<small>Olympic-daero</small></div></div><div class="me"></div></div>
    <div class="card call">
      <div class="portrait"></div>
      <h1>Laura</h1>
      <div class="meta">12:04</div>
      <div class="btns">
        <div class="btn"><svg viewBox="0 0 24 24" fill="#e8eaed"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg></div>
        <div class="btn end"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 9c-1.6 0-3.2.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13.1A1 1 0 0 1 0 12.4c0-.3.1-.5.3-.7C3.3 8.8 7.5 7 12 7s8.7 1.8 11.7 4.7c.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.4c-.2.2-.4.3-.7.3s-.5-.1-.7-.3c-.8-.7-1.7-1.3-2.7-1.8-.3-.2-.6-.5-.6-.9V9.7C15.2 9.3 13.6 9 12 9z"/></svg></div>
      </div>
    </div>
  </div>
</div></body></html>
