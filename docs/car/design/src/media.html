<!doctype html><html><head><meta charset="utf-8"><title>Media fallback</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
.m { flex: 1; display: flex; align-items: center; gap: calc(var(--u) * 44px); padding: calc(var(--u) * 40px); }
.m .portrait { width: calc(var(--u) * 340px); height: calc(var(--u) * 340px); border-radius: calc(var(--u) * 20px); flex: none; }
.m h1 { font-size: calc(var(--u) * 44px); font-weight: 600; letter-spacing: -.8px; color: var(--aa-ink); }
.m .sub { font-size: calc(var(--u) * 26px); color: var(--aa-muted); margin-top: calc(var(--u) * 8px); }
.m .desc { font-size: calc(var(--u) * 24px); color: var(--aa-ink); margin-top: calc(var(--u) * 22px); line-height: 1.35; max-width: 32ch; }
.ctl { display: flex; gap: calc(var(--u) * 22px); margin-top: calc(var(--u) * 34px); align-items: center; }
.ctl i { width: calc(var(--u) * 64px); height: calc(var(--u) * 64px); border-radius: 50%; background: #2b2b2b; display: grid; place-items: center; font-style: normal; color: var(--aa-ink); font-size: calc(var(--u) * 26px); }
.ctl i.play { width: calc(var(--u) * 88px); height: calc(var(--u) * 88px); background: #8ab4f8; color: #0b1a33; }
</style></head>
<body><div class="aa">
  <div class="rail"><div class="clock">9:41</div>
    <div class="apps"><div class="app maps"></div><div class="app laura active"></div><div class="app"></div></div>
    <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="content"><div class="card m">
    <div class="portrait"></div>
    <div><h1>Laura</h1><div class="sub">Listening</div>
      <div class="desc">About 25 minutes. Traffic on Olympic-daero is light.</div>
      <div class="ctl"><i>&#x1F399;</i><i class="play">&#x25B6;</i><i>&#x23FB;</i></div></div>
  </div></div>
</div></body></html>
