<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>Laura settings v2</title>
<style>
:root {
  --res: ../../../clients/android/app/src/main/res;
}
.dark {
  --canvas: #0E0A0F; --s1: #171118; --s2: #201922; --s3: #2C2430; --thumb: #342B38;
  --hair: rgba(255, 236, 228, .075); --hair2: rgba(255, 236, 228, .13);
  --ink: #F6EEE9; --ink2: #D2C4CA; --ink3: #9A8A97; --ink4: #6C5E6B;
  --accent: #FFB47A; --on-accent: #2A1220; --accent-text: #FFC59A; --accent-soft: rgba(255, 180, 122, .13);
  --good: #7FD6A0; --warn: #F2C063; --bad: #F2897F;
  --glow: rgba(255, 170, 110, .16); --shadow: none;
}
.light {
  --canvas: #FAF5F1; --s1: #FFFFFF; --s2: #F2EAE4; --s3: #E9DED6; --thumb: #FFFFFF;
  --hair: rgba(70, 25, 45, .085); --hair2: rgba(70, 25, 45, .15);
  --ink: #26141E; --ink2: #4F3D48; --ink3: #85717D; --ink4: #B3A2AB;
  --accent: #F7A469; --on-accent: #2A1220; --accent-text: #9A3A52; --accent-soft: rgba(247, 164, 105, .18);
  --good: #2E9A5C; --warn: #C2830E; --bad: #CC4A40;
  --glow: rgba(255, 176, 110, .30); --shadow: 0 1px 2px rgba(70, 25, 45, .08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 360px; height: 800px; overflow: hidden; }
body { font-family: Roboto, "Noto Sans KR", sans-serif; background: var(--canvas); color: var(--ink);
  -webkit-font-smoothing: antialiased; letter-spacing: 0; }
.phone { position: relative; width: 360px; height: 800px; overflow: hidden; background: var(--canvas); }
.statusbar { height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 22px;
  font-size: 13px; font-weight: 500; color: var(--ink); }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar .icons i { display: block; width: 14px; height: 10px; border-radius: 2px; background: currentColor; opacity: .85; }
.statusbar .icons i:nth-child(1) { width: 12px; clip-path: polygon(0 100%, 100% 0, 100% 100%); border-radius: 0; }
.statusbar .icons i:nth-child(3) { width: 20px; }
.navbar { position: absolute; bottom: 0; left: 0; right: 0; height: 24px; display: flex; justify-content: center; align-items: center; }
.navbar i { width: 108px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .55; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* sheet chrome */
.scroll { position: absolute; top: 32px; bottom: 24px; left: 0; right: 0; overflow: hidden; padding: 0 16px; }
.grab { height: 14px; display: flex; justify-content: center; align-items: center; }
.grab i { width: 32px; height: 4px; border-radius: 2px; background: var(--hair2); }
.topbar { height: 48px; display: flex; align-items: center; gap: 4px; margin: 0 -8px; }
.iconbtn { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--ink2); }
.topbar .title { font-size: 19px; font-weight: 500; letter-spacing: -.2px; }
h1 { font-size: 30px; font-weight: 500; letter-spacing: -.7px; margin: -4px 4px 16px; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--ink3); margin: 22px 4px 8px; letter-spacing: .2px; }
.card { background: var(--s1); border: 1px solid var(--hair); border-radius: 20px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.sep { height: 1px; background: var(--hair); margin: 0 16px; }
.sep.inset { margin-left: 60px; }

/* hero */
.hero { position: relative; overflow: hidden; padding: 16px; display: flex; gap: 14px; align-items: center; }
.hero::before { content: ""; position: absolute; left: -60px; top: -80px; width: 260px; height: 220px;
  background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; }
.face { position: relative; flex: none; width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle, #FFF1E2 0%, #FFE7CA 50%, #FFD9A8 100%); overflow: hidden; }
.face img { position: absolute; width: 150%; height: 150%; left: -25%; top: -24%; }
.face.big { width: 88px; height: 88px; }
.hero .name { font-size: 18px; font-weight: 500; letter-spacing: -.2px; }
.status { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink2); margin-top: 3px; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
.dot.good { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
.dot.off { background: var(--ink4); }
.sub { font-size: 12.5px; color: var(--ink3); margin-top: 2px; }
.chev { color: var(--ink4); margin-left: auto; }
.chev svg.ic { width: 18px; height: 18px; }

/* controls */
.label { font-size: 15px; font-weight: 500; letter-spacing: -.1px; margin-bottom: 10px; display: flex; justify-content: space-between; }
.label span { font-weight: 400; color: var(--ink3); font-size: 13.5px; }
.seg { display: flex; background: var(--s2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg b { flex: 1; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 500; color: var(--ink3); }
.seg b.on { background: var(--thumb); color: var(--ink); box-shadow: 0 0 0 1px var(--hair2), var(--shadow); }
.hint { font-size: 13px; line-height: 1.45; color: var(--ink3); margin-top: 9px; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; min-height: 64px; }
.tile { width: 32px; height: 32px; border-radius: 10px; background: var(--s2); color: var(--ink2);
  display: flex; align-items: center; justify-content: center; flex: none; }
.tile svg.ic { width: 18px; height: 18px; }
.row .t { font-size: 15.5px; font-weight: 500; letter-spacing: -.1px; }
.row .d { font-size: 13px; color: var(--ink3); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.row .d .dot { width: 6px; height: 6px; box-shadow: none; }
.tip { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--ink3); margin: 18px 6px 0; }
.tip .ic { width: 16px; height: 16px; margin-top: 2px; color: var(--accent-text); }
.q { color: var(--ink2); }

.btn { height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--s2); color: var(--ink); border: 1px solid var(--hair); }
.btn.ghost { color: var(--accent-text); height: 40px; padding: 0 6px; }
.btn.disabled { background: var(--s2); color: var(--ink4); }
.btn.sm { height: 32px; border-radius: 10px; padding: 0 12px; font-size: 13.5px; }
.field { margin-top: 14px; }
.field .fl { font-size: 13px; font-weight: 500; color: var(--ink2); margin: 0 2px 6px; }
.input { height: 50px; border-radius: 12px; background: var(--s2); border: 1px solid var(--hair); display: flex; align-items: center;
  padding: 0 14px; font-size: 15px; color: var(--ink); overflow: hidden; white-space: nowrap; }
.input.mono { font-family: "Noto Mono", monospace; font-size: 12.5px; color: var(--ink2); }
.input.focus { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 3px var(--accent-soft); }
.or { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink3); margin: 18px 2px 2px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--hair); }

.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--s3); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; width: 22px; height: 22px; border-radius: 11px; left: 3px; top: 3px; background: var(--ink3); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 21px; background: var(--on-accent); }
.check { width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
.check.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.check.todo { border: 1.5px dashed var(--warn); }
.check svg.ic { width: 13px; height: 13px; stroke-width: 2.4; }
.step { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; }
.step .t { font-size: 15px; font-weight: 500; }
.step .d { font-size: 12.5px; line-height: 1.45; color: var(--ink3); margin-top: 2px; }
.step .act { margin-left: auto; }
.progress { height: 4px; border-radius: 2px; background: var(--s2); overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; width: 80%; background: var(--accent); border-radius: 2px; }
.mono { font-family: "Noto Mono", monospace; }

/* main screen */
.main { background: #0F0D17; }
.main .avatar { position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; transform: translate(-50%, -50%);
  -webkit-mask-image: radial-gradient(circle, #000 42%, transparent 66%); }
.main .label-under { position: absolute; bottom: 86px; left: 0; right: 0; text-align: center; font-size: 12px; color: #8E89A3; }
.fab { position: absolute; right: 20px; bottom: 40px; width: 44px; height: 44px; border-radius: 22px;
  background: rgba(255, 240, 232, .07); border: 1px solid rgba(255, 240, 232, .11); color: rgba(246, 238, 233, .72);
  display: flex; align-items: center; justify-content: center; }
.fab.lit { box-shadow: 0 0 0 6px rgba(255, 180, 122, .12), 0 0 0 1px rgba(255, 180, 122, .5); color: #FFC59A; }
.swipe { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: rgba(246, 238, 233, .34); font-size: 11.5px; letter-spacing: .3px; }
.coach { position: absolute; right: 16px; bottom: 100px; width: 268px; background: #1C1520; border: 1px solid rgba(255, 236, 228, .12);
  border-radius: 18px; padding: 14px 14px 6px 16px; color: #F6EEE9; }
.coach::after { content: ""; position: absolute; right: 30px; bottom: -7px; width: 12px; height: 12px; background: #1C1520;
  border-right: 1px solid rgba(255, 236, 228, .12); border-bottom: 1px solid rgba(255, 236, 228, .12); transform: rotate(45deg); }
.coach .ct { font-size: 15px; font-weight: 500; }
.coach .cb { font-size: 13px; line-height: 1.5; color: #CDBFC4; margin-top: 4px; }
.coach .cb b { color: #FFC59A; font-weight: 500; white-space: nowrap; }
.coach .ca { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.coach .ca span { font-size: 12px; color: #8F8290; }
.coach .ca .btn { color: #FFC59A; }
.screen { display: none; }
.screen.show { display: block; }
.log { font-size: 13px; padding: 7px 11px; border-radius: 12px; background: var(--s2); display: inline-block; margin-top: 6px; max-width: 86%; }
.log.me { background: var(--accent-soft); }
</style>
</head>
<body>
<script>
const P = {
  down: 'M6 9l6 6 6-6', right: 'M9 6l6 6-6 6', back: 'M15 6l-6 6 6 6', up: 'M6 15l6-6 6 6',
  sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',
  voice: 'M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2',
  car: 'M5 17h14M5 17v-5l2-5h10l2 5v5M5 17v2M19 17v2M5 12h14M8 14.5h1M15 14.5h1',
  watch: 'M9 6h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM9.5 6l.5-3h4l.5 3M9.5 18l.5 3h4l.5-3',
  spark: 'M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7zM18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z',
  server: 'M5 4h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM5 13h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zM8 7.5h.01M8 16.5h.01',
  info: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 8h.01',
  code: 'M9 8l-4 4 4 4M15 8l4 4-4 4',
  qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 19h1M19 14h1',
  mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21',
  check: 'M5 12.5l4.5 4.5L19 7.5',
  bt: 'M7 7.5l10 9-5 4.5V3l5 4.5-10 9',
  lock: 'M7 11h10a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM8.5 11V8a3.5 3.5 0 0 1 7 0v3',
  bubble: 'M12 4a8 8 0 0 1 0 16a8 8 0 0 1-7-4.2L4 20l1-4.2A8 8 0 0 1 12 4z',
  globe: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3.5 9h17M3.5 15h17M12 3c2.5 2.7 3.5 5.7 3.5 9s-1 6.3-3.5 9c-2.5-2.7-3.5-5.7-3.5-9s1-6.3 3.5-9z',
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const RES = '../../../clients/android/app/src/main/res';
const face = (big) => `<div class="face ${big ? 'big' : ''}"><img src="${RES}/drawable-xxxhdpi/ic_launcher_foreground.png"></div>`;
const chrome = (inner, sheet = true) => `
  <div class="statusbar"><span>9:41</span><span class="icons"><i></i><i></i><i></i></span></div>
  <div class="scroll">${sheet ? '<div class="grab"><i></i></div>' : ''}${inner}</div>
  <div class="navbar"><i></i></div>`;
const seg = (opts, on) => `<div class="seg">${opts.map((o, i) => `<b class="${i === on ? 'on' : ''}">${o}</b>`).join('')}</div>`;
const row = (icon, t, d, extra = '') => `<div class="row"><div class="tile">${ic(icon)}</div><div><div class="t">${t}</div><div class="d">${d}</div></div><div class="chev">${extra}${ic('right')}</div></div>`;
const sub = (title, inner) => chrome(`<div class="topbar"><div class="iconbtn">${ic('back')}</div><div class="title">${title}</div></div>${inner}`, false);

const conversation = `
  <div class="eyebrow">Conversation</div>
  <div class="card">
    <div class="pad">
      <div class="label">Listening</div>
      ${seg(['Hands-free', 'Push to talk'], 0)}
      <div class="hint">She listens all the time and answers when you talk to her. Tap her to mute.</div>
    </div>
    <div class="sep"></div>
    <div class="pad">
      <div class="label">Language</div>
      ${seg(['Auto', '한국어', 'English'], 0)}
    </div>
  </div>`;

const everywhere = `
  <div class="eyebrow">Around you</div>
  <div class="card">
    ${row('voice', 'Your voice', 'Enrolled · 31 s')}
    <div class="sep inset"></div>
    ${row('car', 'Car', 'Automatic · no car right now')}
    <div class="sep inset"></div>
    ${row('watch', 'Watch', 'Reply volume +6 dB')}
    <div class="sep inset"></div>
    ${row('spark', 'Call her from anywhere', '<i class="dot warn"></i>4 of 5 ready')}
  </div>`;

const screens = {
  home: () => chrome(`
    <div class="topbar"><div class="iconbtn">${ic('down')}</div></div>
    <h1>Settings</h1>
    <div class="card hero">
      ${face()}
      <div style="position:relative">
        <div class="name">Laura</div>
        <div class="status"><i class="dot good"></i>Connected · Laura linked</div>
        <div class="sub">hect.dev:8443 · certificate pinned</div>
      </div>
      <div class="chev" style="position:relative">${ic('right')}</div>
    </div>
    ${conversation}
    ${everywhere}
    <div class="eyebrow">App</div>
    <div class="card">${row('info', 'About', 'Version 0.1')}</div>
  `),
  welcome: () => chrome(`
    <div class="topbar"></div>
    <div class="card hero" style="flex-direction:column;align-items:flex-start;padding:22px 20px 20px">
      ${face(true)}
      <div style="position:relative;margin-top:14px">
        <div style="font-size:26px;font-weight:500;letter-spacing:-.6px">Hi, I'm Laura</div>
        <div style="font-size:14.5px;line-height:1.5;color:var(--ink2);margin-top:6px">Connect me to your Laura server and I'm ready to talk, in English or 한국어.</div>
      </div>
      <div style="position:relative;width:100%;margin-top:20px;display:flex;flex-direction:column;gap:10px">
        <div class="btn primary">${ic('qr')}Scan setup QR code</div>
        <div class="btn secondary">Enter server details</div>
      </div>
    </div>
    ${conversation}
    <div class="eyebrow">Finding settings later</div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:12px;font-size:13.5px;color:var(--ink2)">
      <div style="display:flex;gap:12px;align-items:center"><div class="tile">${ic('sliders')}</div>Tap the round button under her, or swipe up</div>
      <div style="display:flex;gap:12px;align-items:center"><div class="tile">${ic('mic')}</div><span>Say <span style="color:var(--ink)">“Laura, open settings”</span> · <span style="color:var(--ink)">“로라, 설정 열어줘”</span></span></div>
    </div>
  `),
  connection: () => sub('Server', `
    <div class="card hero" style="margin-top:6px;padding:14px 16px">
      <div style="position:relative">
        <div class="status" style="margin:0;font-size:14.5px;color:var(--ink)"><i class="dot good"></i>Connected</div>
        <div class="sub" style="margin-top:4px">Laura linked · replies from Local · Bonsai 9B or Claude via Hermes</div>
      </div>
    </div>
    <div class="btn secondary" style="margin-top:16px">${ic('qr')}Scan setup QR code</div>
    <div class="or">or enter it yourself</div>
    <div class="field"><div class="fl">Server URL</div><div class="input focus">wss://hect.dev:8443/ws</div></div>
    <div class="field"><div class="fl">Access key</div><div class="input" style="letter-spacing:3px">••••••••••••••••</div></div>
    <div class="field"><div class="fl">Certificate pin (SHA-256)</div><div class="input mono">9f2c41d7a0e3b85c6f1e2d4a7b9c0e13f5a8…</div></div>
    <div style="display:flex;align-items:center;margin-top:18px">
      <div class="btn ghost">${ic('lock')}Fetch certificate</div>
      <div class="btn primary" style="margin-left:auto;padding:0 20px">Save &amp; connect</div>
    </div>
    <div class="hint" style="margin:16px 2px 0">The key and pin stay on this phone; only the key is sent to the server.</div>
  `),
  car: () => sub('Car', `
    <div class="card pad" style="margin-top:6px">
      <div class="label">Car mode</div>
      ${seg(['Automatic', 'Always on', 'Off'], 0)}
      <div class="hint">Turns on by itself in the car (Android Auto or the car's Bluetooth). <span class="q">No car detected.</span></div>
    </div>
    <div class="eyebrow">Detection</div>
    <div class="card">
      ${row('bt', "Car's Bluetooth", 'Choose your car’s Bluetooth')}
    </div>
    <div class="hint" style="margin:8px 6px 0">Optional: car mode also turns on while the phone is connected to this device.</div>
    <div class="eyebrow">Android Auto</div>
    <div class="card">
      <div class="row" style="align-items:flex-start">
        <div><div class="t">Car call</div>
        <div class="hint" style="margin-top:4px">In the car Laura is a call: Android Auto shows her call screen, she uses the car's mic and speakers, and navigation prompts and music wait while the call is up. She turns on when the car connects; hanging up turns her off (Call Laura in Android Auto brings her back).</div></div>
        <div class="switch on" style="margin-top:2px"></div>
      </div>
    </div>
  `),
  invoke: () => sub('Call her from anywhere', `
    <div class="hint" style="margin:4px 4px 14px;font-size:13.5px;color:var(--ink2)">Hold the side button to call Laura from anywhere, even the lock screen. She pops up over whatever is on screen, listens right away, and leaves when you're done.</div>
    <div class="card">
      <div class="pad" style="padding-bottom:6px">
        <div class="label" style="margin:0">Setup<span>4 of 5 ready</span></div>
        <div class="progress"><i></i></div>
      </div>
      <div class="step"><div class="check ok">${ic('check')}</div><div><div class="t">Microphone</div><div class="d">Allowed.</div></div></div>
      <div class="sep inset" style="margin-left:50px"></div>
      <div class="step"><div class="check ok">${ic('check')}</div><div><div class="t">Default digital assistant</div><div class="d">Laura is your digital assistant app.</div></div><div class="act btn ghost sm">Change</div></div>
      <div class="sep inset" style="margin-left:50px"></div>
      <div class="step"><div class="check todo"></div><div><div class="t">Side button</div><div class="d">Try holding the side button. If she doesn't come up, set Press and hold → Digital assistant app.</div></div><div class="act btn secondary sm">Open</div></div>
      <div class="sep inset" style="margin-left:50px"></div>
      <div class="step"><div class="check ok">${ic('check')}</div><div><div class="t">Display over other apps</div><div class="d">She can float over other apps.</div></div></div>
      <div class="sep inset" style="margin-left:50px"></div>
      <div class="step"><div class="check ok">${ic('check')}</div><div><div class="t">Battery</div><div class="d">Not restricted.</div></div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <div class="btn secondary" style="flex:1">${ic('mic')}Try it</div>

    <div class="eyebrow">Floating Laura</div>
    <div class="card"><div class="row" style="align-items:flex-start">
      <div><div class="t">Float over other apps</div><div class="hint" style="margin-top:4px">While she's on and you leave the app, a small bubble shows her. Tap stops a reply, hold to talk, drag to the × to turn her off.</div></div>
      <div class="switch on" style="margin-top:2px"></div></div></div>
  `),
  about: () => sub('About', `
    <div class="card hero" style="margin-top:6px">
      ${face()}
      <div style="position:relative"><div class="name">Laura</div><div class="sub" style="font-size:13.5px">Version 0.1</div></div>
    </div>
    <div class="eyebrow">Developer</div>
    <div class="card">
      <div class="pad">
        <div class="label">Audio route</div>
        ${seg(['Auto', 'Media', 'Call'], 0)}
        <div class="hint">Media: replies play like music; the mic pauses while she talks. Call: echo-cancelled, voice barge-in on the loudspeaker. Auto picks for you.</div>
      </div>
      <div class="sep"></div>
      <div class="pad">
        <div class="label">Codec</div>
        ${seg(['Opus', 'PCM'], 0)}
      </div>
      <div class="sep"></div>
      <div class="pad mono" style="font-size:11.5px;line-height:1.6;color:var(--ink3);background:var(--s2);margin:12px 16px;border-radius:12px;padding:10px 12px">rtt 38 ms · up 21 kbps · down 26 kbps<br>turn 0.84 s · opus/opus<br>audio: call (loudspeaker, AEC)<br>Laura linked · voice enrolled (31 s)</div>
      <div style="display:flex;gap:8px;padding:0 16px 16px">
        <div class="btn secondary sm" style="flex:1;height:40px">Turn off</div>
        <div class="btn secondary sm" style="flex:1;height:40px">Reconnect</div>
        <div class="btn secondary sm" style="flex:1.4;height:40px">Send to watch</div>
      </div>
    </div>
    <div class="eyebrow">Conversation</div>
    <div class="card pad" style="padding-top:10px">
      <div style="text-align:right"><span class="log me">Laura, what's on tomorrow?</span></div>
      <div><span class="log">Two things: the dentist at ten, and dinner with Minji at seven.</span></div>
    </div>
  `),
  main: (coach) => `
    <img class="avatar" src="${RES}/drawable-nodpi/car_avatar.png">
    <div class="statusbar" style="color:#F6EEE9"><span>9:41</span><span class="icons"><i></i><i></i><i></i></span></div>
    ${coach ? `<div class="coach"><div class="ct">Settings live here</div>
      <div class="cb">Tap this button or swipe up. You can also just ask: <b>“Laura, open settings”</b> or <b>“로라, 설정 열어줘”</b></div>
      <div class="ca"><span>Long-press her works too</span><div class="btn ghost sm">Got it</div></div></div>` : ''}
    <div class="label-under">${coach ? '' : 'Local · Bonsai 9B'}</div>
    <div class="fab ${coach ? 'lit' : ''}">${ic('sliders')}</div>
    <div class="navbar"><i style="background:#F6EEE9;opacity:.45"></i></div>`,
};
const q = new URLSearchParams(location.search);
const name = q.get('s') || 'home', theme = q.get('t') || 'dark';
const el = document.createElement('div');
el.className = `phone ${theme} ${name.startsWith('main') ? 'main' : ''}`;
el.innerHTML = name === 'main-coach' ? screens.main(true) : screens[name]();
document.body.className = theme;
document.body.appendChild(el);
</script>
